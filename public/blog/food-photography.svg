    <linearGradient id="day" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#faf9f7" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#faf9f7" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#faf9f7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="60" y="70" width="150" height="490" rx="8" fill="#faf9f7" opacity="0.16"/>
  <rect x="72" y="82" width="126" height="230" rx="4" fill="#faf9f7" opacity="0.10"/>
  <rect x="72" y="326" width="126" height="222" rx="4" fill="#faf9f7" opacity="0.10"/>
  <rect width="1200" height="630" fill="url(#day)"/>
  <circle cx="660" cy="315" r="200" fill="#faf9f7" opacity="0.07"/>
  <circle cx="660" cy="315" r="168" fill="#f3efe7"/>
  <circle cx="660" cy="315" r="140" fill="#d9432b" opacity="0.85"/>
  <g fill="#f7f4ee">
