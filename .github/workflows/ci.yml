name: CI

# The gate, enforced by something other than memory.
#
# Vercel already builds every push and its build depends on `test`, so a broken
# suite cannot deploy. What it cannot do is tell you *before* you merge, and it
# never runs `typecheck` or `knip` at all. This closes both gaps: the same four
# commands that pass locally have to pass on the pull request.
on:
  pull_request:
  push:
    branches: [main]

# A second push supersedes the first. Nothing here is a deploy, so cancelling
# an in-flight run costs nothing and stops a queue forming on a busy branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: typecheck · test · lint · knip · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Placeholders, not secrets. Nothing in the gate talks to a real service:
      # the suites mock their clients, `next build` compiles without a
      # connection, and knip's drizzle plugin only needs the variable to be
      # present and well-formed to load `drizzle.config.ts`. They are shaped to
      # satisfy the schemas in `*/keys.ts` so CI exercises the real config path.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-placeholder-not-a-real-secret
      # Remote caching switches itself on the moment these exist. Absent, turbo
      # falls back to its local cache and the run is merely slower.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - uses: actions/checkout@v4

      # No version pinned here on purpose — the action reads `packageManager`
      # from package.json, so the lockfile and CI can never disagree.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # `--frozen-lockfile` is the point: a package.json edited without a
      # matching lockfile update fails here rather than resolving to something
      # different from what anyone tested.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Separate steps rather than one chained command, so a red run names the
      # thing that broke without anyone opening the log.
      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Test
        run: pnpm turbo run test

      - name: Lint
        run: pnpm turbo run lint

      # Must run with DATABASE_URL set. Without it the drizzle plugin cannot
      # load the config and floods the output with false "unused export" hits
      # on every *Relations symbol.
      - name: Knip
        run: pnpm knip

      # The four gates above say nothing about the app's *native* configuration —
      # a missing icon, an SDK-mismatched package or a permission string Apple
      # will reject all typecheck and test perfectly well. expo-doctor is the
      # only thing that reads that half, and 16 of its 18 checks are exactly the
      # things nobody notices until a build fails.
      #
      # Two of the eighteen are expected to fail, and neither is going to be
      # "fixed":
      #
      #   - **Metro config.** metro.config.js deliberately overrides
      #     `watchFolders` and `disableHierarchicalLookup`. That override is the
      #     only reason pnpm workspace resolution works here at all; its own
      #     comment explains what breaks without it. expo-doctor has no way to
      #     be told a project meant it.
      #   - **Duplicate dependencies.** apps/web is on React 19.2 and Expo SDK
      #     54 pins 19.1, so a hoisted layout keeps both — and has since before
      #     the mobile app existed. Metro never resolves the second one, for the
      #     same reason the check above fires.
      #
      # So this fails on any *third* failure rather than on those two. That is
      # the difference between a gate and a `|| true`: a new problem in the app
      # config still turns this red, and the two known ones are named here
      # rather than hidden behind a flag.
      - name: Expo doctor
        run: |
          set -uo pipefail
          # `run` is not optional: `pnpm doctor` is a built-in pnpm command, so
          # without it this runs pnpm's own doctor and never touches Expo.
          pnpm --filter @sailo/mobile run doctor > doctor.log 2>&1 || true
          cat doctor.log

          # Proves it actually ran. Without this, expo-doctor failing to start
          # would produce an empty log and read as "nothing wrong".
          if ! grep -qE 'checks? (passed|failed)' doctor.log; then
            echo "::error::expo-doctor did not produce a summary — it did not run"
            exit 1
          fi

          known='Check for issues with Metro config|Check that no duplicate dependencies are installed'
          unexpected=$(grep '^✖' doctor.log | grep -vE "$known" || true)
          if [ -n "$unexpected" ]; then
            echo "::error::expo-doctor found something new:"
            echo "$unexpected"
            exit 1
          fi

      - name: Build
        run: pnpm turbo run build
