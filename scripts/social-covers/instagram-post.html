<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Instagram grid post, 540x540 rendered at 2x = 1080x1080. Instagram has
     no cover image, so this is the pinned-post version of the same claim. -->
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="covers.css">
<style>
  body { width: 540px; height: 540px; }

  .top { position: absolute; top: 46px; left: 0; right: 0; text-align: center; }
  .top .wordmark { height: 28px; }
  .top h1 { margin-top: 16px; font-size: 38px; }
  .top .badge { margin-top: 16px; font-size: 11.5px; padding: 0.55em 1.1em; }

  .shops {
    position: absolute;
    left: 50%;
    top: 252px;
    transform: translateX(-50%);
    display: flex;
  }
  .shop { --w: 170px; gap: 10px; margin-left: -12px; }
  .shop:first-child { margin-left: 0; }
  .shop:nth-child(2) { z-index: 2; }
  .pill { font-size: 12px; }
</style>
</head>
<body>
  <div class="top">
    <img class="wordmark" src="../../public/brand/sailo-logo.svg" alt="Sailo">
    <h1 class="display">The link in your bio<br>should be <span class="hl">taking orders</span>.</h1>
    <span class="badge"><span class="dot"></span>Free to start, free to stay</span>
  </div>

  <div class="shops">
    <figure class="shop" style="--dy: 34px; --accent: #db2777">
      <span class="pill"><span class="dot"></span>sailo.store/lumi</span>
      <div class="phone"><div class="screen"><img src="../../public/demos/lumi-phone.png" alt="Lumière Nails"></div></div>
    </figure>
    <figure class="shop" style="--dy: 0px; --accent: #c2410c">
      <span class="pill"><span class="dot"></span>sailo.store/forno</span>
      <div class="phone"><div class="screen"><img src="../../public/demos/forno-phone.png" alt="Forno Nove"></div></div>
    </figure>
    <figure class="shop" style="--dy: 34px; --accent: #14b8a6">
      <span class="pill"><span class="dot"></span>sailo.store/serene</span>
      <div class="phone"><div class="screen"><img src="../../public/demos/serene-phone.png" alt="Serenity Rooms"></div></div>
    </figure>
  </div>
</body>
</html>
